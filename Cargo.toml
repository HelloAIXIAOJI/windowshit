[workspace]
resolver = "2"
members = ["crates/ping", "crates/ipconfig", "crates/tracert", "crates/pathping", "crates/whoami", "crates/hostname", "crates/ver", "crates/where", "crates/tree", "crates/findstr", "crates/getmac", "crates/type", "crates/sort", "crates/more", "crates/clip", "crates/tasklist", "crates/taskkill", "crates/systeminfo", "crates/i18n", "crates/trace-core", "crates/args", "crates/netinfo", "crates/winreg"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
