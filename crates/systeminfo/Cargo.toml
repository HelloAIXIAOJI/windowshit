[package]
name = "systeminfo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust 重写的 Windows systeminfo.exe（跨平台整活）"

[[bin]]
name = "systeminfo"
path = "src/main.rs"

[dependencies]
windowshit-i18n = { path = "../i18n" }
sysinfo = "0.39"
os_info = { version = "3.15", default-features = false }
hostname_rs = { package = "hostname", version = "0.4" }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(not(windows))'.dependencies]
netdev = { version = "0.46", features = ["gateway"] }
