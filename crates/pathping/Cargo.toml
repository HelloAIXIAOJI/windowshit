[package]
name = "pathping"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust 重写的 Windows pathping.exe（跨平台整活）"

[[bin]]
name = "pathping"
path = "src/main.rs"

[dependencies]
windowshit-i18n = { path = "../i18n" }
windowshit-trace-core = { path = "../trace-core" }
surge-ping = "0.9"
socket2 = "0.6"
tokio.workspace = true
dns-lookup = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
